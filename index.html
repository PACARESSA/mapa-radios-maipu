<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Censal de Maipú</title>
    <!-- Hojas de estilo de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Librería para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .popup-chart { width: 220px; height: 160px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Centrar mapa en Maipú, Buenos Aires
        var map = L.map('map').setView([-36.8621, -57.8801], 13);

        // Capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Cargar el GeoJSON
        fetch('radios_maipu.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: "#2b8cbe",
                        weight: 2,
                        fillOpacity: 0.4
                    },
                    onEachFeature: function (feature, layer) {
                        var props = feature.properties;
                        var popupId = 'chart-' + (props.radio_id || Math.random().toString(36).substring(7));

                        var popupContent = `
                            <div style="text-align: center;">
                                <b>Radio Censal: ${props.radio_id || 'S/D'}</b><br>
                                <small>Población total: ${props.poblacion_total || 0}</small>
                            </div>
                            <div class="popup-chart">
                                <canvas id="${popupId}"></canvas>
                            </div>
                        `;

                        layer.bindPopup(popupContent);

                        layer.on('popupopen', function () {
                            var ctx = document.getElementById(popupId).getContext('2d');
                            new Chart(ctx, {
                                type: 'bar',
                                data: {
                                    labels: ['0-14', '15-64', '65+'],
                                    datasets: [
                                        {
                                            label: 'Varones',
                                            data: [props.varones_0_14 || 0, props.varones_15_64 || 0, props.varones_65 || 0],
                                            backgroundColor: '#3498db'
                                        },
                                        {
                                            label: 'Mujeres',
                                            data: [props.mujeres_0_14 || 0, props.mujeres_15_64 || 0, props.mujeres_65 || 0],
                                            backgroundColor: '#e74c3c'
                                        }
                                    ]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    scales: { y: { beginAtZero: true } }
                                }
                            });
                        });
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Error al cargar el archivo GeoJSON:", err));
    </script>
</body>
</html>
